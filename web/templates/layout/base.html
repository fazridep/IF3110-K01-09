{{define "layout"}}<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{template "title" .}} · DB Platform</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.0.6/css/pico.min.css">
  <style>
    nav form { margin: 0; }
    nav button { margin: 0; padding: .4rem .9rem; }
    .narrow { max-width: 380px; margin: 10vh auto; }
    .error { color: var(--pico-del-color); }
  </style>
</head>
<body>
  {{with .User}}
  <header class="container">
    <nav>
      <ul><li><strong>DB Platform</strong></li></ul>
      <ul>
        <li>{{.Username}}{{if .IsPlatformAdmin}} (Admin){{end}}</li>
        <li>
          <form method="post" action="/logout">
            <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
            <button type="submit" class="secondary outline">Logout</button>
          </form>
        </li>
      </ul>
    </nav>
  </header>
  {{end}}
  <main class="container">
    {{template "content" .}}
  </main>
</body>
</html>
{{end}}
