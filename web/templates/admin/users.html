{{define "title"}}Users{{end}}

{{define "content"}}
<h1>Users</h1>
<table>
  <thead>
    <tr>
      <th>Username</th>
      <th>Platform Admin</th>
      <th>Dibuat</th>
      <th>Aksi</th>
    </tr>
  </thead>
  <tbody>
    {{range .Data.Users}}
    <tr>
      <td>{{.Username}}</td>
      <td>{{if .IsPlatformAdmin}}✓ Admin{{else}}—{{end}}</td>
      <td>{{.CreatedAt.Format "2006-01-02 15:04"}}</td>
      <td>
        <form method="post" action="/admin/users/{{.ID}}/toggle-admin" style="margin:0">
          <input type="hidden" name="csrf_token" value="{{$.CSRFToken}}">
          <button type="submit" class="outline secondary" style="padding:.3rem .6rem;margin:0">
            {{if .IsPlatformAdmin}}Cabut Admin{{else}}Jadikan Admin{{end}}
          </button>
        </form>
      </td>
    </tr>
    {{else}}
    <tr><td colspan="4">Belum ada user.</td></tr>
    {{end}}
  </tbody>
</table>
{{end}}
