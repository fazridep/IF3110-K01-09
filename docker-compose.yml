services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform_metadata
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform_metadata"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - metadata_data:/var/lib/postgresql

  db-target:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: target
      POSTGRES_PASSWORD: target
      POSTGRES_DB: target_db
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U target -d target_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - target_data:/var/lib/postgresql

  db-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: platform_test
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d platform_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql

volumes:
  metadata_data:
  target_data:
